name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增级别'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 MSVC 编译环境 (VS 2022)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译资源文件 (UAC 清单)
        shell: cmd
        run: |
          rc /nologo /fo main.res main_manifest.rc
          rc /nologo /fo logger.res main_manifest.rc

      - name: 编译 logger.exe
        shell: cmd
        run: |
          cl /nologo /W3 /O2 /EHsc /utf-8 /MT /DWIN32 /DNDEBUG /D_CONSOLE /DUNICODE /D_UNICODE logger.cpp logger.res /Fe:logger.exe /link /SUBSYSTEM:CONSOLE /MANIFEST:NO advapi32.lib shell32.lib

      - name: 编译 main.exe
        shell: cmd
        run: |
          cl /nologo /W3 /O2 /EHsc /utf-8 /MT /DWIN32 /DNDEBUG /D_CONSOLE /DUNICODE /D_UNICODE main.cpp main.res /Fe:main.exe /link /SUBSYSTEM:CONSOLE /MANIFEST:NO advapi32.lib shell32.lib

      - name: 计算下一个版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 直接按版本号从远端取最新标签。不能用 git describe：
          # 它只会选当前提交可达的标签，而 v1.0.1 指向的提交不在 main 历史上，
          # 会导致每次重算出 v1.0.1，永远创建不了新发行版。
          LATEST_TAG=$(git ls-remote --tags origin 'v*' \
            | sed -E 's|.*refs/tags/||; s|\^\{\}$||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "当前最新标签: $LATEST_TAG"

          # 去掉 v 前缀
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # 默认值保护
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # 根据触发方式决定递增级别
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::计算出的版本号为空"
            exit 1
          fi

          echo "新版本号: $NEW_VERSION"
          {
            echo "version=$NEW_VERSION"
            echo "previous_tag=$LATEST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: 创建标签并发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.version }}"
          PREV="${{ steps.version.outputs.previous_tag }}"

          if [ -z "$TAG" ]; then
            echo "::error::版本号为空，无法发布"
            exit 1
          fi

          # 幂等：同名发行版已存在则跳过，避免重复运行时报错
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::发行版 $TAG 已存在，跳过创建"
            exit 0
          fi

          # 标签不存在时 gh 会自动创建，并基于当前提交发布
          gh release create "$TAG" main.exe logger.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --latest \
            --notes "## 🔄 自动构建发行版

          从 \`$PREV\` → \`$TAG\`

          ### 📦 包含文件
          - \`main.exe\` — 主程序
          - \`logger.exe\` — 看门狗/日志进程

          ### 🛠️ 构建信息
          - 编译器: MSVC (cl.exe / Visual Studio 2022, v143)
          - 标准: C++11
          - 链接: 静态链接 (/MT)"

          echo "已发布 Release: $TAG"
